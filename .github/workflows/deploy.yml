name: Build and Deploy Transporte Para Todos

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'argocd/**'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cloudlabhost/transporteparatodos:latest
            cloudlabhost/transporteparatodos:${{ github.sha }}

      - name: Atualizar tag da imagem no Helm
        run: |
          sed -i "s|tag: .*|tag: ${{ github.sha }}|" helm/transporteparatodos/values.yaml

      - name: Commit da nova tag no Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/transporteparatodos/values.yaml
          git commit -m "Atualiza imagem para ${{ github.sha }} [skip ci]"
          git push
