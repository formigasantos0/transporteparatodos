apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: transporteparatodos
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/formigasantos0/transporteparatodos.git
    targetRevision: main
    path: helm/transporteparatodos

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
