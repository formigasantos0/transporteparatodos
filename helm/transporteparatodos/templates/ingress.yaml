apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transporteparatodos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - lab.transporteparatodos.org.br
      secretName: lab-transporteparatodos-tls

  rules:
    - host: transporteparatodos.org.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transporteparatodos
                port:
                  number: 80

    - host: lab.transporteparatodos.org.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transporteparatodos
                port:
                  number: 80
